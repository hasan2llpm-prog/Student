<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#2563eb">

    <meta name="description"
          content="منصة تعليمية للطلاب العراقيين">

    <title>Student</title>


    <!-- CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!--
        محتوى التطبيق يتم إنشاؤه بواسطة app.js
    -->


    <script>

        /*
        ============================================================
        تحميل إعدادات التطبيق
        ============================================================
        */

        async function startStudentApp() {

            try {

                /*
                ----------------------------------------------------
                قراءة config.json
                ----------------------------------------------------
                */

                const response = await fetch(
                    "config.json",
                    {
                        cache: "no-store"
                    }
                );


                if (!response.ok) {

                    throw new Error(
                        "تعذر تحميل config.json"
                    );

                }


                const config =
                    await response.json();


                /*
                ----------------------------------------------------
                حفظ الإعدادات بشكل عام
                ----------------------------------------------------
                */

                window.APP_CONFIG =
                    config;


                /*
                ----------------------------------------------------
                إنشاء Supabase Client
                ----------------------------------------------------
                */

                if (
                    window.supabase &&
                    config.supabase_url &&
                    config.supabase_key
                ) {

                    window.supabaseClient =
                        window.supabase.createClient(
                            config.supabase_url,
                            config.supabase_key
                        );

                }


                /*
                ----------------------------------------------------
                تحميل app.js
                ----------------------------------------------------
                */

                const script =
                    document.createElement("script");


                script.src =
                    "app.js";


                script.async =
                    false;


                document.body.appendChild(
                    script
                );


            } catch (error) {

                console.error(
                    "Student App Error:",
                    error
                );


                /*
                ----------------------------------------------------
                عرض الخطأ فقط إذا فشل تحميل الإعدادات
                ----------------------------------------------------
                */

                document.body.innerHTML = `

                    <div style="
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        padding:20px;
                        box-sizing:border-box;
                        background:#ffffff;
                        font-family:Arial,sans-serif;
                        direction:rtl;
                    ">

                        <div style="
                            width:100%;
                            max-width:450px;
                            padding:25px;
                            border-radius:18px;
                            background:#f8d7da;
                            color:#721c24;
                            text-align:center;
                            line-height:1.8;
                        ">

                            <h2 style="
                                margin-top:0;
                            ">
                                تعذر تشغيل التطبيق
                            </h2>

                            <p>
                                تحقق من وجود
                                <b>config.json</b>
                                في نفس مجلد
                                <b>index.html</b>.
                            </p>

                        </div>

                    </div>

                `;

            }

        }


        /*
        ============================================================
        بدء التطبيق
        ============================================================
        */

        startStudentApp();

    </script>


</body>

</html>
