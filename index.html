<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0095f6">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================
           شاشة المصادقة
        ========================= */

        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #ffffff;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .auth-logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #0095f6;
            font-style: italic;
            font-family: cursive;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #262626;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            direction: rtl;
        }

        .auth-form input:focus {
            border-color: #0095f6;
        }

        .auth-button {
            border: none;
            background: #0095f6;
            color: #fff;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            margin-top: 16px;
            text-align: center;
            color: #0095f6;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-message {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            min-height: 22px;
        }

        .auth-message.error {
            color: #d93025;
        }

        .auth-message.success {
            color: #16803c;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           اسم المستخدم
        ========================= */

        .welcome-user {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
            text-align: right;
        }


        /* =========================
           الصفحة الرئيسية المصغرة + الإعلانات
        ========================= */
        #main-screen .cards-grid {
            gap: 9px !important;
            padding: 9px 12px 5px !important;
        }
        #main-screen .card {
            min-height: 105px !important;
            padding: 9px 7px !important;
            border-radius: 14px !important;
        }
        #main-screen .card-icon {
            width: 58px !important;
            height: 58px !important;
            font-size: 25px !important;
        }
        #main-screen .card-title {
            font-size: 17px !important;
            margin-top: 7px !important;
        }
        #student-home-ads {
            margin: 7px 12px 86px;
            display: none;
        }
        #student-home-ads.show { display: block; }
        .student-home-ads-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 18px;
            background: #f4f6f8;
            border: 1px solid #e1e4e8;
        }
        .student-home-ads-track {
            display: flex;
            height: 100%;
            direction: ltr;
            transition: transform .55s ease;
            will-change: transform;
        }
        .student-home-ad-slide {
            flex: 0 0 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .student-home-ad-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .student-home-ad-caption {
            position: absolute;
            inset-inline: 0;
            bottom: 0;
            padding: 22px 14px 10px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(transparent, rgba(0,0,0,.68));
            direction: rtl;
        }
        .student-home-ads-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding-top: 9px;
        }
        .student-home-ads-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            border: 0;
            background: #c7cbd1;
            padding: 0;
        }
        .student-home-ads-dot.active {
            width: 20px;
            background: #0095f6;
        }

    </style>
</head>

<body>

    <!-- =========================================
         شاشة تسجيل الدخول / إنشاء الحساب
    ========================================== -->

    <section id="auth-screen">

        <div class="auth-box">

            <div class="auth-logo">Student</div>

            <div class="auth-subtitle">
                منصة تعليمية للطلاب العراقيين
            </div>

            <!-- تسجيل الدخول -->
            <div id="login-section">

                <h2 class="auth-title">تسجيل الدخول</h2>

                <form id="login-form" class="auth-form">

                    <input
                        type="text"
                        id="login-email"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        inputmode="email"
                        dir="ltr"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                    <input
                        type="password"
                        id="login-password"
                        placeholder="كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="submit"
                        id="login-btn"
                        class="auth-button"
                    >
                        دخول
                    </button>

                </form>

                <div
                    id="login-message"
                    class="auth-message"
                ></div>

                <div
                    id="show-register"
                    class="auth-switch"
                >
                    ليس لديك حساب؟ إنشاء حساب
                </div>

            </div>

            <!-- إنشاء حساب -->
            <div id="register-section" class="hidden">

                <h2 class="auth-title">إنشاء حساب جديد</h2>

                <form id="register-form" class="auth-form">

                    <input
                        type="text"
                        id="register-name"
                        placeholder="الاسم الكامل"
                        autocomplete="name"
                        required
                    >

                    <input
                        type="text"
                        id="register-email"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        inputmode="email"
                        dir="ltr"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                    <input
                        type="password"
                        id="register-password"
                        placeholder="كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <input
                        type="password"
                        id="register-password-confirm"
                        placeholder="تأكيد كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="submit"
                        id="register-btn"
                        class="auth-button"
                    >
                        إنشاء الحساب
                    </button>

                </form>

                <div
                    id="register-message"
                    class="auth-message"
                ></div>

                <div
                    id="show-login"
                    class="auth-switch"
                >
                    لديك حساب؟ تسجيل الدخول
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
         التطبيق الرئيسي
    ========================================== -->

    <section id="main-screen" class="hidden">

        <!-- الهيدر -->
        <header>

            <div class="header-icons">
                <i class="fa-regular fa-bell"></i>
            </div>

            <div>
                <div class="logo">Student</div>
                <div id="welcome-user" class="welcome-user"></div>
            </div>

            <div class="header-icons">
                <i
                    id="menu-icon"
                    class="fa-solid fa-bars"
                ></i>
            </div>

        </header>

        <!-- شريط الستوري: في أعلى الرئيسية قبل المراحل -->
        <section class="student-home-stories" aria-label="الستوريات">
            <div class="stories-container"></div>
        </section>

        <!-- البطاقات -->
        <div class="main-content">

            <div class="cards-grid">

                <div
                    class="card"
                    onclick="openStage('primary')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div class="card-title">
                        الابتدائي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('middle')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-school"></i>
                    </div>

                    <div class="card-title">
                        الإعدادي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('secondary')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>

                    <div class="card-title">
                        الثانوي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('university')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-university"></i>
                    </div>

                    <div class="card-title">
                        الجامعة
                    </div>
                </div>

            </div>

        </div>

        <!-- شريط إعلانات الصفحة الرئيسية -->
        <section id="student-home-ads" aria-label="الإعلانات">
            <div class="student-home-ads-viewport">
                <div class="student-home-ads-track" id="student-home-ads-track"></div>
            </div>
            <div class="student-home-ads-dots" id="student-home-ads-dots"></div>
        </section>

        <!-- التنقل السفلي -->
        <nav>
            <a href="#" data-section="home" class="active" aria-label="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </a>

            <a href="#" data-section="search" aria-label="البحث">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>

            <a href="#" data-section="store" aria-label="المتجر">
                <i class="fa-solid fa-store"></i>
            </a>

            <a href="#" data-section="messages" aria-label="الرسائل">
                <i class="fa-regular fa-paper-plane"></i>
            </a>

            <a href="#" data-section="reels" aria-label="الريلز">
                <i class="fa-solid fa-clapperboard"></i>
            </a>
        </nav>

    </section>


    <!-- =========================================
         JavaScript
    ========================================== -->

    <!-- الملف الحالي الأساسي: لا نعدله -->
    <script src="app.js?v=2.2.0"></script>

    <!-- نظام الإشعارات اللحظية والخارجية -->
    <script src="notifications.js?v=1.0.0"></script>

    <!-- نظام الملف الشخصي المستقل -->
    <script src="profile.js"></script>

    <!-- نظام الـ Stories الحالي -->
    <script src="stories.js"></script>

    <!-- نظام نشر الريلز -->
    <script src="posts.js?v=2.2.0"></script>

</body>
</html>
