<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- التصميم -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0095f6">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* =========================
           شاشة تسجيل الدخول
        ========================= */

        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #ffffff;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .auth-logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #0095f6;
            font-style: italic;
            font-family: cursive;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #262626;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            direction: rtl;
        }

        .auth-form input:focus {
            border-color: #0095f6;
        }

        .auth-button {
            border: none;
            background: #0095f6;
            color: #ffffff;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            margin-top: 16px;
            text-align: center;
            color: #0095f6;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-message {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            min-height: 22px;
        }

        .auth-message.error {
            color: #d93025;
        }

        .auth-message.success {
            color: #16803c;
        }

        .hidden {
            display: none !important;
        }

        .welcome-user {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
            text-align: right;
        }

        /* =========================
           زر تسجيل الخروج العائم
        ========================= */

        .floating-logout {
            position: fixed;
            left: 18px;
            bottom: 82px;
            width: 58px;
            height: 58px;
            border: none;
            border-radius: 50%;
            background: #0095f6;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 6px 18px rgba(0, 149, 246, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .floating-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(0, 149, 246, 0.45);
        }

        .floating-logout:active {
            transform: scale(0.94);
        }
