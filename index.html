<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student</title>

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.1.1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0095f6">

    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ===== Student fast splash ===== */
        #student-fast-splash{position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .16s ease,visibility .16s ease;pointer-events:none}
        #student-fast-splash img{width:78px;height:78px;border-radius:20px;object-fit:cover;box-shadow:0 10px 28px rgba(0,149,246,.16)}
        #student-fast-splash strong{font-size:26px;font-weight:1000;color:#087cff;letter-spacing:.2px}
        #student-fast-splash.student-splash-hide{opacity:0;visibility:hidden}

        /* =========================
           شاشة المصادقة
        ========================= */

        #auth-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #ffffff;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 16px;
            padding: 28px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .auth-logo {
            text-align: center;
            font-size: 34px;
            font-weight: bold;
            color: #0095f6;
            font-style: italic;
            font-family: cursive;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .auth-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            color: #262626;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .auth-form input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            direction: rtl;
        }

        .auth-form input:focus {
            border-color: #0095f6;
        }

        .auth-button {
            border: none;
            background: #0095f6;
            color: #fff;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            margin-top: 16px;
            text-align: center;
            color: #0095f6;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-message {
            margin-top: 14px;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            min-height: 22px;
        }

        .auth-message.error {
            color: #d93025;
        }

        .auth-message.success {
            color: #16803c;
        }

        .hidden {
            display: none !important;
        }

        /* =========================
           اسم المستخدم
        ========================= */

        .welcome-user {
            font-size: 13px;
            color: #666;
            margin-top: 3px;
            text-align: right;
        }


        /* =========================
           الصفحة الرئيسية المصغرة + الإعلانات
        ========================= */
        #main-screen .cards-grid {
            display:grid !important;
            grid-template-columns:repeat(5,minmax(0,1fr)) !important;
            gap:5px !important;
            padding:7px 8px 3px !important;
            align-items:start !important;
        }
        #main-screen .card {
            min-height:0 !important;
            padding:0 !important;
            border:0 !important;
            border-radius:0 !important;
            background:transparent !important;
            box-shadow:none !important;
            display:flex !important;
            flex-direction:column !important;
            align-items:center !important;
            justify-content:flex-start !important;
            gap:3px !important;
        }
        #main-screen .card-icon {
            width:49px !important;
            height:49px !important;
            min-width:49px !important;
            border-radius:50% !important;
            font-size:20px !important;
            background:#eef7ff !important;
            color:#0878c9 !important;
            border:1px solid #d9ecfb !important;
            display:grid !important;
            place-items:center !important;
        }
        #main-screen .card-title {
            font-size:10px !important;
            line-height:1.2 !important;
            font-weight:800 !important;
            margin-top:2px !important;
            text-align:center !important;
            white-space:nowrap !important;
        }
        #student-home-ads {
            margin: 7px 12px 86px;
            display: none;
        }
        #student-home-ads.show { display: block; }
        .student-home-ads-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 18px;
            background: #f4f6f8;
            border: 1px solid #e1e4e8;
        }
        .student-home-ads-track {
            display: flex;
            height: 100%;
            direction: ltr;
            transition: transform .55s ease;
            will-change: transform;
        }
        .student-home-ad-slide {
            flex: 0 0 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        .student-home-ad-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .student-home-ad-caption {
            position: absolute;
            inset-inline: 0;
            bottom: 0;
            padding: 22px 14px 10px;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(transparent, rgba(0,0,0,.68));
            direction: rtl;
        }
        .student-home-ads-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding-top: 9px;
        }
        .student-home-ads-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            border: 0;
            background: #c7cbd1;
            padding: 0;
        }
        .student-home-ads-dot.active {
            width: 20px;
            background: #0095f6;
        }


        /* ===== Accessibility & rendering performance hardening ===== */
        :focus-visible {
            outline: 3px solid rgba(0, 149, 246, 0.38);
            outline-offset: 3px;
        }
        
        button, a, input, select, textarea, [role="button"] {
            -webkit-tap-highlight-color: transparent;
        }
        
        img, video {
            max-width: 100%;
        }
        
        .student-internal-body,
        .student-store-body,
        .sm-body,
        .sn-body {
            contain: layout style;
        }
        
        @supports (content-visibility: auto) {
            .student-store-product,
            .student-store-order,
            .ste-content-card,
            .sn-item,
            .sm-row {
                content-visibility: auto;
                contain-intrinsic-size: 1px 120px;
            }
        }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        

    </style>
</head>

<body>

    <div id="student-fast-splash" aria-hidden="true">
        <img src="icon-192.png" alt="">
        <strong>Student</strong>
    </div>

    <!-- =========================================
         شاشة تسجيل الدخول / إنشاء الحساب
    ========================================== -->

    <section id="auth-screen" aria-label="تسجيل الدخول">

        <div class="auth-box">

            <div class="auth-logo">Student</div>

            <div class="auth-subtitle">
                منصة تعليمية للطلاب العراقيين
            </div>

            <!-- تسجيل الدخول -->
            <div id="login-section">

                <h2 class="auth-title">تسجيل الدخول</h2>

                <form id="login-form" class="auth-form">

                    <input
                        type="text"
                        id="login-email"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        inputmode="email"
                        dir="ltr"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                    <input
                        type="password"
                        id="login-password"
                        placeholder="كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="submit"
                        id="login-btn"
                        class="auth-button"
                    >
                        دخول
                    </button>

                </form>

                <div
                    id="login-message"
                    class="auth-message"
                ></div>

                <div
                    id="show-register"
                    class="auth-switch"
                >
                    ليس لديك حساب؟ إنشاء حساب
                </div>

            </div>

            <!-- إنشاء حساب -->
            <div id="register-section" class="hidden">

                <h2 class="auth-title">إنشاء حساب جديد</h2>

                <form id="register-form" class="auth-form">

                    <input
                        type="text"
                        id="register-name"
                        placeholder="الاسم الكامل"
                        autocomplete="name"
                        required
                    >

                    <input
                        type="text"
                        id="register-email"
                        placeholder="البريد الإلكتروني"
                        autocomplete="email"
                        inputmode="email"
                        dir="ltr"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                    <input
                        type="password"
                        id="register-password"
                        placeholder="كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <input
                        type="password"
                        id="register-password-confirm"
                        placeholder="تأكيد كلمة المرور"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="submit"
                        id="register-btn"
                        class="auth-button"
                    >
                        إنشاء الحساب
                    </button>

                </form>

                <div
                    id="register-message"
                    class="auth-message"
                ></div>

                <div
                    id="show-login"
                    class="auth-switch"
                >
                    لديك حساب؟ تسجيل الدخول
                </div>

            </div>

        </div>

    </section>


    <!-- =========================================
         التطبيق الرئيسي
    ========================================== -->

    <section id="main-screen" class="hidden" aria-label="التطبيق الرئيسي">

        <!-- الهيدر -->
        <header>

            <button class="header-icons" type="button" aria-label="الإشعارات" style="border:0;background:transparent">
                <i class="fa-regular fa-bell" aria-hidden="true"></i>
            </button>

            <div>
                <div class="logo">Student</div>
                <div id="welcome-user" class="welcome-user"></div>
            </div>

            <button class="header-icons" type="button" aria-label="القائمة" style="border:0;background:transparent">
                <i
                    id="menu-icon"
                    class="fa-solid fa-bars"
                    aria-hidden="true"
                ></i>
            </button>

        </header>

        <!-- شريط الستوري: في أعلى الرئيسية قبل المراحل -->
        <section class="student-home-stories" aria-label="الستوريات">
            <div class="stories-container"></div>
        </section>

        <!-- البطاقات -->
        <div class="main-content">

            <div class="cards-grid">

                <div
                    class="card"
                    onclick="openStage('primary')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>

                    <div class="card-title">
                        الابتدائي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('middle')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-school"></i>
                    </div>

                    <div class="card-title">
                        الإعدادي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('secondary')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-building-columns"></i>
                    </div>

                    <div class="card-title">
                        الثانوي
                    </div>
                </div>


                <div
                    class="card"
                    onclick="openStage('university')"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-university"></i>
                    </div>

                    <div class="card-title">
                        الجامعة
                    </div>
                </div>

                <div
                    class="card"
                    onclick="window.StudentAI?.open?.()"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>

                    <div class="card-title">
                        Student AI
                    </div>
                </div>


                <div
                    class="card"
                    onclick="window.StudentLearnEnglish?.open?.()"
                >
                    <div class="card-icon">
                        <i class="fa-solid fa-language"></i>
                    </div>

                    <div class="card-title">
                        Learn English
                    </div>
                </div>

            </div>

        </div>

        <!-- شريط إعلانات الصفحة الرئيسية -->
        <section id="student-home-ads" aria-label="الإعلانات">
            <div class="student-home-ads-viewport">
                <div class="student-home-ads-track" id="student-home-ads-track"></div>
            </div>
            <div class="student-home-ads-dots" id="student-home-ads-dots"></div>
        </section>

        <!-- التنقل السفلي -->
        <nav>
            <a href="#" data-section="home" class="active" aria-label="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </a>

            <a href="#" data-section="search" aria-label="البحث">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>

            <a href="#" data-section="store" aria-label="المتجر">
                <i class="fa-solid fa-store"></i>
            </a>

            <a href="#" data-section="messages" aria-label="الرسائل">
                <i class="fa-regular fa-paper-plane"></i>
            </a>
        </nav>

    </section>


    <!-- =========================================
         JavaScript
    ========================================== -->
    <script>
        (()=>{const hide=()=>document.getElementById('student-fast-splash')?.classList.add('student-splash-hide');
        if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(hide,260),{once:true});else setTimeout(hide,180);
        setTimeout(hide,900);})();
    </script>
    <script defer src="app.js?v=3.5.1"></script>
    <script defer src="social.js?v=1.2.0"></script>
    <script defer src="student-ai-bank.js?v=2.1.0"></script>
    <script defer src="student-ai-cefr-bank.js?v=2.1.0"></script>
    <script defer src="student-ai.js?v=2.1.0"></script>

</body>
</html>
