<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#2563eb">

    <meta name="description" content="تطبيق Student">

    <title>Student</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* شاشة التشخيص */
        #boot-status {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999999999;
            padding: 16px;
            background: #fff3cd;
            color: #222;
            font-family: Arial, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            direction: rtl;
            text-align: right;
            display: block !important;
            box-sizing: border-box;
        }

        #boot-status.success {
            background: #d1e7dd;
            color: #0f5132;
        }

        #boot-status.error {
            background: #f8d7da;
            color: #721c24;
        }

        #boot-status.hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <!-- =========================================================
         شاشة تشخيص مؤقتة للشاشة البيضاء
         ========================================================= -->
    <div id="boot-status">
        جاري تشغيل تطبيق Student...
    </div>


    <!-- =========================================================
         التطبيق
         ========================================================= -->
    <div id="app">
        <!-- سيتم تحميل محتوى التطبيق من app.js -->
    </div>


    <script>
        /*
        ============================================================
        حماية من الشاشة البيضاء
        ============================================================
        */

        const bootStatus = document.getElementById("boot-status");

        function showBootError(title, message, details = "") {
            if (!bootStatus) return;

            bootStatus.className = "error";

            bootStatus.innerHTML = `
                <strong>${title}</strong><br>
                ${message}
                ${details ? `<br><small>${details}</small>` : ""}
            `;
        }

        function showBootSuccess(message) {
            if (!bootStatus) return;

            bootStatus.className = "success";

            bootStatus.innerHTML = `
                <strong>تم تشغيل الصفحة بنجاح</strong><br>
                ${message}
            `;
        }


        /*
        ============================================================
        التقاط أخطاء JavaScript
        ============================================================
        */

        window.addEventListener("error", function(event) {

            console.error("JavaScript Error:", event.error || event.message);

            showBootError(
                "حدث خطأ في التطبيق",
                event.message || "خطأ JavaScript غير معروف",
                `
                الملف: ${event.filename || "غير معروف"}<br>
                السطر: ${event.lineno || "غير معروف"}<br>
                العمود: ${event.colno || "غير معروف"}
                `
            );

        });


        /*
        ============================================================
        التقاط Promise Errors
        ============================================================
        */

        window.addEventListener("unhandledrejection", function(event) {

            console.error(
                "Unhandled Promise Rejection:",
                event.reason
            );

            let reason = event.reason;

            if (reason && reason.message) {
                reason = reason.message;
            }

            showBootError(
                "خطأ JavaScript",
                reason || "حدث خطأ غير معروف"
            );

        });


        /*
        ============================================================
        اختبار Supabase
        ============================================================
        */

        if (typeof window.supabase === "undefined") {

            showBootError(
                "فشل تحميل Supabase",
                "مكتبة Supabase لم يتم تحميلها."
            );

        }


        /*
        ============================================================
        تحميل config.json
        ============================================================
        */

        async function loadConfig() {

            try {

                const response = await fetch(
                    "config.json",
                    {
                        cache: "no-store"
                    }
                );

                if (!response.ok) {

                    throw new Error(
                        "تعذر تحميل config.json. رمز الاستجابة: "
                        + response.status
                    );

                }

                const config = await response.json();

                /*
                ----------------------------------------------------
                التحقق من بيانات Supabase
                ----------------------------------------------------
                */

                if (!config.supabase_url) {

                    throw new Error(
                        "supabase_url غير موجود داخل config.json"
                    );

                }

                if (!config.supabase_key) {

                    throw new Error(
                        "supabase_key غير موجود داخل config.json"
                    );

                }


                /*
                ----------------------------------------------------
                إنشاء اتصال Supabase
                ----------------------------------------------------
                */

                if (typeof window.supabase !== "undefined") {

                    window.supabaseClient =
                        window.supabase.createClient(
                            config.supabase_url,
                            config.supabase_key
                        );

                }


                /*
                ----------------------------------------------------
                حفظ الإعدادات
                ----------------------------------------------------
                */

                window.APP_CONFIG = config;


                console.log(
                    "تم تحميل config.json بنجاح"
                );

                console.log(
                    "Supabase URL:",
                    config.supabase_url
                );


                /*
                ----------------------------------------------------
                تحميل app.js بعد نجاح config
                ----------------------------------------------------
                */

                loadAppScript();

            } catch (error) {

                console.error(
                    "Config Error:",
                    error
                );

                showBootError(
                    "فشل تشغيل التطبيق",
                    error.message || "تعذر تحميل الإعدادات."
                );

            }

        }


        /*
        ============================================================
        تحميل app.js
        ============================================================
        */

        function loadAppScript() {

            const script = document.createElement("script");

            script.src = "app.js";

            script.async = false;

            script.onload = function() {

                console.log(
                    "تم تحميل app.js بنجاح"
                );


                /*
                ----------------------------------------------------
                ننتظر قليلًا حتى يبدأ التطبيق
                ----------------------------------------------------
                */

                setTimeout(function() {

                    const app =
                        document.getElementById("app");

                    /*
                    ------------------------------------------------
                    إذا ظهر شيء داخل التطبيق
                    ------------------------------------------------
                    */

                    if (
                        app &&
                        app.children.length > 0
                    ) {

                        showBootSuccess(
                            "تم تشغيل تطبيق Student بنجاح."
                        );

                        setTimeout(function() {

                            bootStatus.className =
                                "hidden";

                        }, 1200);

                    }

                    /*
                    ------------------------------------------------
                    إذا بقي التطبيق فارغًا
                    ------------------------------------------------
                    */

                    else {

                        showBootError(
                            "التطبيق لم يعرض المحتوى",
                            "تم تحميل app.js ولكن لم يتم إنشاء واجهة التطبيق.",
                            "تحقق من app.js."
                        );

                    }

                }, 1500);

            };


            script.onerror = function() {

                console.error(
                    "تعذر تحميل app.js"
                );

                showBootError(
                    "تعذر تحميل app.js",
                    "ملف app.js غير موجود أو لم يتم تحميله.",
                    "تأكد أن اسم الملف هو app.js وأنه في نفس مجلد index.html."
                );

            };


            document.body.appendChild(script);

        }


        /*
        ============================================================
        بدء التشغيل
        ============================================================
        */

        loadConfig();


        /*
        ============================================================
        حماية إضافية من بقاء شاشة التشغيل
        ============================================================
        */

        setTimeout(function() {

            if (
                bootStatus &&
                bootStatus.innerHTML.includes(
                    "جاري تشغيل تطبيق Student"
                )
            ) {

                showBootError(
                    "التطبيق توقف أثناء التشغيل",
                    "لم يكتمل تشغيل التطبيق خلال الوقت المتوقع.",
                    "تحقق من config.json وapp.js."
                );

            }

        }, 8000);

    </script>

</body>
</html>
