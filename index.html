<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <meta name="theme-color" content="#2563eb">

    <meta name="description"
          content="تطبيق Student">

    <title>Student</title>


    <!-- =========================================================
         CSS
         ========================================================= -->

    <link rel="stylesheet" href="style.css">


    <!-- =========================================================
         Supabase
         ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================================================
         شاشة التشخيص
         ========================================================= -->

    <style>

        #boot-status {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 999999999;

            padding: 14px 16px;

            background: #fff3cd;

            color: #222;

            font-family: Arial, sans-serif;

            font-size: 15px;

            line-height: 1.7;

            direction: rtl;

            text-align: right;

            box-sizing: border-box;

        }


        #boot-status.success {

            background: #d1e7dd;

            color: #0f5132;

        }


        #boot-status.error {

            background: #f8d7da;

            color: #721c24;

        }


        #boot-status.hidden {

            display: none !important;

        }

    </style>

</head>


<body>


    <!-- =========================================================
         رسالة التشغيل
         ========================================================= -->

    <div id="boot-status">
        جاري تشغيل تطبيق Student...
    </div>



    <!-- =========================================================
         لا نحصر التطبيق داخل #app
         لأن app.js قد ينشئ عناصره مباشرة داخل body
         ========================================================= -->



    <script>

        /*
        ============================================================
        عناصر التشخيص
        ============================================================
        */

        const bootStatus =
            document.getElementById("boot-status");



        /*
        ============================================================
        إظهار خطأ
        ============================================================
        */

        function showBootError(title, message, details = "") {

            if (!bootStatus) return;

            bootStatus.className = "error";

            bootStatus.innerHTML =

                "<strong>" +
                title +
                "</strong><br>" +

                message +

                (
                    details
                    ?
                    "<br><small>" +
                    details +
                    "</small>"
                    :
                    ""
                );

        }



        /*
        ============================================================
        إظهار نجاح
        ============================================================
        */

        function showBootSuccess(message) {

            if (!bootStatus) return;

            bootStatus.className = "success";

            bootStatus.innerHTML =

                "<strong>تم تشغيل التطبيق</strong><br>" +
                message;

        }



        /*
        ============================================================
        التقاط أخطاء JavaScript
        ============================================================
        */

        window.addEventListener(
            "error",
            function(event) {

                console.error(
                    "JavaScript Error:",
                    event.error || event.message
                );

                showBootError(

                    "حدث خطأ في JavaScript",

                    event.message ||
                    "خطأ غير معروف",

                    "الملف: " +
                    (event.filename || "غير معروف") +
                    "<br>السطر: " +
                    (event.lineno || "غير معروف") +
                    "<br>العمود: " +
                    (event.colno || "غير معروف")

                );

            }
        );



        /*
        ============================================================
        التقاط Promise Errors
        ============================================================
        */

        window.addEventListener(
            "unhandledrejection",
            function(event) {

                console.error(
                    "Unhandled Promise Rejection:",
                    event.reason
                );

                let reason =
                    event.reason;

                if (
                    reason &&
                    reason.message
                ) {

                    reason =
                        reason.message;

                }

                showBootError(

                    "خطأ في التطبيق",

                    reason ||
                    "حدث خطأ غير معروف"

                );

            }
        );



        /*
        ============================================================
        التحقق من Supabase
        ============================================================
        */

        if (
            typeof window.supabase ===
            "undefined"
        ) {

            showBootError(

                "فشل تحميل Supabase",

                "لم يتم تحميل مكتبة Supabase."

            );

        }



        /*
        ============================================================
        تحميل config.json
        ============================================================
        */

        async function loadConfig() {

            try {

                const response =
                    await fetch(
                        "config.json",
                        {
                            cache: "no-store"
                        }
                    );


                if (!response.ok) {

                    throw new Error(

                        "تعذر تحميل config.json." +
                        " رمز الاستجابة: " +
                        response.status

                    );

                }


                const config =
                    await response.json();



                /*
                ====================================================
                التحقق من الإعدادات
                ====================================================
                */

                if (
                    !config.supabase_url
                ) {

                    throw new Error(

                        "supabase_url غير موجود داخل config.json"

                    );

                }


                if (
                    !config.supabase_key
                ) {

                    throw new Error(

                        "supabase_key غير موجود داخل config.json"

                    );

                }



                /*
                ====================================================
                إنشاء عميل Supabase
                ====================================================
                */

                window.APP_CONFIG =
                    config;


                if (
                    typeof window.supabase !==
                    "undefined"
                ) {

                    window.supabaseClient =

                        window.supabase.createClient(

                            config.supabase_url,

                            config.supabase_key

                        );

                }



                console.log(
                    "تم تحميل config.json بنجاح"
                );

                console.log(
                    "Supabase:",
                    config.supabase_url
                );



                /*
                ====================================================
                تحميل app.js
                ====================================================
                */

                loadAppScript();

            }

            catch (error) {

                console.error(
                    "Config Error:",
                    error
                );


                showBootError(

                    "فشل تشغيل التطبيق",

                    error.message ||
                    "تعذر تحميل config.json"

                );

            }

        }



        /*
        ============================================================
        تحميل app.js
        ============================================================
        */

        function loadAppScript() {

            const script =
                document.createElement("script");


            script.src =
                "app.js";


            script.async =
                false;



            /*
            ========================================================
            تم تحميل app.js
            ========================================================
            */

            script.onload =
                function() {

                    console.log(
                        "تم تحميل app.js بنجاح"
                    );


                    /*
                    ------------------------------------------------
                    لا نفحص #app
                    لأن التطبيق قد يستخدم body مباشرة
                    ------------------------------------------------
                    */

                    setTimeout(

                        function() {

                            showBootSuccess(

                                "تم تحميل ملفات التطبيق بنجاح."

                            );


                            /*
                            ----------------------------------------
                            إخفاء الرسالة بعد ثانية
                            ----------------------------------------
                            */

                            setTimeout(

                                function() {

                                    if (
                                        bootStatus
                                    ) {

                                        bootStatus.className =
                                            "hidden";

                                    }

                                },

                                1000

                            );

                        },

                        1000

                    );

                };



            /*
            ========================================================
            فشل تحميل app.js
            ========================================================
            */

            script.onerror =
                function() {

                    console.error(
                        "تعذر تحميل app.js"
                    );


                    showBootError(

                        "تعذر تحميل app.js",

                        "ملف app.js لم يتم تحميله.",

                        "تأكد من وجود app.js في نفس مجلد index.html."

                    );

                };



            /*
            ========================================================
            إضافة script إلى الصفحة
            ========================================================
            */

            document.body.appendChild(
                script
            );

        }



        /*
        ============================================================
        بدء التطبيق
        ============================================================
        */

        loadConfig();



        /*
        ============================================================
        حماية من توقف التشغيل
        ============================================================
        */

        setTimeout(

            function() {

                if (
                    bootStatus &&
                    !bootStatus.classList.contains(
                        "hidden"
                    ) &&
                    bootStatus.innerHTML.includes(
                        "جاري تشغيل تطبيق Student"
                    )
                ) {

                    showBootError(

                        "توقف تشغيل التطبيق",

                        "لم يكتمل تشغيل الملفات.",

                        "تحقق من config.json و app.js."

                    );

                }

            },

            10000

        );

    </script>


</body>

</html>
