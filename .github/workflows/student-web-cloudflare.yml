name: Deploy Student Web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/student-web-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-web-cloudflare
  cancel-in-progress: true

env:
  CF_PAGES_PROJECT: student-learning

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Student
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Enable pnpm
        run: npm install --global pnpm@11.25.0

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Student Web
        working-directory: web
        run: pnpm build

      - name: Create Cloudflare Pages project if missing
        continue-on-error: true
        run: npx --yes wrangler@latest pages project create "$CF_PAGES_PROJECT" --production-branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Student Web
        run: npx --yes wrangler@latest pages deploy web/dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
