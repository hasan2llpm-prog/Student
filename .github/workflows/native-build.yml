name: Build Student v1.8.0 Production Final

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-English-v1.8.0-PRODUCTION-FINAL.zip'
      - '.github/workflows/student-v1.8.0-production.yml'

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Student Production
        run: |
          rm -rf production-build
          mkdir -p production-build
          unzip -q Student-English-v1.8.0-PRODUCTION-FINAL.zip -d production-build
          test -f production-build/Student-Native-Full-v1.0/gradlew
          test -f production-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/CommunityScreen.kt
          test -f production-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/MessagesScreen.kt
          test -f production-build/Student-Native-Full-v1.0/supabase/migrations/20260828_student_v17_interactions.sql
          grep -q "versionName '1.7.0'" production-build/Student-Native-Full-v1.0/app/build.gradle

      - name: Restore signing key
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          test -n "$STUDENT_KEYSTORE_B64" || (echo "Missing STUDENT_KEYSTORE_B64" && exit 1)
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/student-release-upload.jks" \
            -storepass "${{ secrets.STUDENT_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.STUDENT_KEY_ALIAS }}" >/dev/null

      - name: Build signed Production APK and AAB
        working-directory: production-build/Student-Native-Full-v1.0
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableRelease :app:bundleStableRelease

      - name: Verify signed APK
        run: |
          APK="production-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.8.0-Production-APK
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Production AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.8.0-Production-AAB
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/bundle/stableRelease/app-stable-release.aab
          if-no-files-found: error
          retention-days: 30
