name: Build Student APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Stable APK
        run: ./gradlew assembleStableDebug --stacktrace

      - name: Build Beta APK
        run: ./gradlew assembleBetaDebug --stacktrace

      - name: Build Stable AAB
        run: ./gradlew bundleStableDebug --stacktrace

      - name: Upload Stable APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Stable-APK
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Beta-APK
          path: app/build/outputs/apk/beta/debug/*.apk
          if-no-files-found: error

      - name: Upload Stable AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-Stable-AAB
          path: app/build/outputs/bundle/stableDebug/*.aab
          if-no-files-found: error
