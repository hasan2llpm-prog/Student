name: Build Student Full Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-Native-Full-v1.0-FIX1.zip'
      - '.github/workflows/native-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Student Full Native
        run: |
          rm -rf native-build artifact
          mkdir -p native-build artifact
          unzip -q Student-Native-Full-v1.0-FIX1.zip -d native-build

      - name: Build debug APK
        run: |
          cd native-build/Student-Native-Full-v1.0
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../artifact/Student-Full-Native-v1.0-FIX1-debug.apk

      - name: Upload Student Full Native APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Full-Native-v1.0-FIX1-debug
          path: artifact/Student-Full-Native-v1.0-FIX1-debug.apk
          if-no-files-found: error
          retention-days: 14
