name: Build Student v2.1.0 Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Student-v2.1.0-BETA-VOCAB5000.zip'
      - '.github/workflows/student-v2.1.0-beta-build.yml'

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Student Native Beta
        shell: bash
        run: |
          set -euo pipefail
          test -f Student-v2.1.0-BETA-VOCAB5000.zip
          rm -rf student-src
          mkdir -p student-src
          unzip -q Student-v2.1.0-BETA-VOCAB5000.zip -d student-src

      - name: Verify Beta source
        shell: bash
        working-directory: student-src
        run: |
          set -euo pipefail
          test -f app/build.gradle
          test -f app/src/main/java/com/student/app/MainActivity.kt
          test -f feature/home/src/main/java/com/student/feature/home/Oxford5000Vocabulary.kt
          test -f feature/home/src/main/assets/oxford_5000_ar.json
          grep -q "applicationId 'com.studentiraq.app'" app/build.gradle
          grep -q "versionCode 22" app/build.gradle
          grep -q "versionName '2.1.0'" app/build.gradle
          test "$(python3 - <<'PY'
import json
with open('feature/home/src/main/assets/oxford_5000_ar.json', encoding='utf-8') as f:
    print(len(json.load(f)))
PY
)" = "5000"

      - name: Restore release signing key
        shell: bash
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "${STUDENT_KEYSTORE_B64:-}" || (echo 'Missing STUDENT_KEYSTORE_B64' && exit 1)
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"

      - name: Build signed Beta APK
        shell: bash
        working-directory: student-src
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBetaRelease --stacktrace

      - name: Collect Beta APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find student-src/app/build/outputs/apk/beta/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/Student-v2.1.0-BETA.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.1.0-BETA-APK
          path: dist/Student-v2.1.0-BETA.apk
          if-no-files-found: error
