name: Build Student English v1.3.1 Production

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-English-v1.3.1-PRODUCTION.zip'
      - '.github/workflows/student-english-production-v1.3.1-build.yml'

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract production project
        run: |
          rm -rf production-build
          mkdir production-build
          unzip -q Student-English-v1.3.1-PRODUCTION.zip -d production-build
          test -f production-build/Student-Native-Full-v1.0/gradlew
          test -f production-build/Student-Native-Full-v1.0/app/build.gradle

      - name: Restore signing key
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          test -n "$STUDENT_KEYSTORE_B64" || (echo "Missing STUDENT_KEYSTORE_B64" && exit 1)
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/student-release-upload.jks" -storepass "${{ secrets.STUDENT_KEYSTORE_PASSWORD }}" -alias "${{ secrets.STUDENT_KEY_ALIAS }}" >/dev/null

      - name: Build signed APK and AAB
        working-directory: production-build/Student-Native-Full-v1.0
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableRelease :app:bundleStableRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-English-v1.3.1-APK-MediaFire
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-English-v1.3.1-AAB-GooglePlay
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/bundle/stableRelease/app-stable-release.aab
          if-no-files-found: error
          retention-days: 30
