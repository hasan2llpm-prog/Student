name: Build Student Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-Native-Core-v0.1-FIX2.zip'
      - '.github/workflows/native-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Student Native project
        run: |
          rm -rf native-build
          mkdir -p native-build
          unzip -q Student-Native-Core-v0.1-FIX2.zip -d native-build

      - name: Build debug APK
        working-directory: native-build/Student-Native-Core-v0.1
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Native-v0.1-debug
          path: native-build/Student-Native-Core-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
