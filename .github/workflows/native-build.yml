name: Build Student v1.4.1 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-English-v1.4.1-BETA.zip'
      - '.github/workflows/student-v1.4-beta-build.yml'

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Student v1.4.1 Beta
        run: |
          rm -rf beta-build
          mkdir -p beta-build
          unzip -q Student-English-v1.4.1-BETA.zip -d beta-build
          test -f beta-build/Student-Native-Full-v1.0/gradlew
          test -f beta-build/Student-Native-Full-v1.0/app/build.gradle
          test -f beta-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/MessagesScreen.kt
          test -f beta-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/ProfileScreen.kt
          test -f beta-build/Student-Native-Full-v1.0/supabase/migrations/20260826_student_v14_social_learning.sql

      - name: Restore signing key
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          test -n "$STUDENT_KEYSTORE_B64" || (echo "Missing STUDENT_KEYSTORE_B64" && exit 1)
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/student-release-upload.jks" \
            -storepass "${{ secrets.STUDENT_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.STUDENT_KEY_ALIAS }}" >/dev/null

      - name: Build signed Beta APK
        working-directory: beta-build/Student-Native-Full-v1.0
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBetaRelease

      - name: Verify Beta APK
        run: |
          APK="beta-build/Student-Native-Full-v1.0/app/build/outputs/apk/beta/release/app-beta-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload Student v1.4.1 Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.4.1-Beta-APK
          path: beta-build/Student-Native-Full-v1.0/app/build/outputs/apk/beta/release/app-beta-release.apk
          if-no-files-found: error
          retention-days: 30
