name: Build Student Full Native APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/native-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          rm -rf native-build
          mkdir -p native-build
          unzip -q Student-Native-Full-v1.0-FIX2-UI.zip -d native-build

      - name: Fix Compose border import
        run: |
          FILE="native-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/FeedScreen.kt"
          grep -q "import androidx.compose.foundation.border" "$FILE" || \
          sed -i '/^package /a import androidx.compose.foundation.border' "$FILE"

      - name: Build debug APK
        working-directory: native-build/Student-Native-Full-v1.0
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Student APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Native-Full-FIX3-debug
          path: native-build/Student-Native-Full-v1.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
