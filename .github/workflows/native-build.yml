name: Build Student v1.0.0 Production

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-Native-v1.0.0-PRODUCTION.zip'
      - '.github/workflows/release-build.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract production project
        run: |
          rm -rf production-build
          mkdir -p production-build
          unzip -q Student-Native-v1.0.0-PRODUCTION.zip -d production-build
          test -f production-build/Student-Native-Full-v1.0/app/build.gradle
          test -f production-build/Student-Native-Full-v1.0/gradlew
          echo "Production project ready"

      - name: Restore signing keystore
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          if [ -z "$STUDENT_KEYSTORE_B64" ]; then
            echo "Missing STUDENT_KEYSTORE_B64 secret"
            exit 1
          fi
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/student-release-upload.jks" \
            -storepass "${{ secrets.STUDENT_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.STUDENT_KEY_ALIAS }}" >/dev/null
          echo "Signing keystore verified"

      - name: Build signed Release APK and AAB
        working-directory: production-build/Student-Native-Full-v1.0
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleStableRelease \
            :app:bundleStableRelease

      - name: Verify signed APK
        run: |
          APK="production-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Show production outputs
        run: |
          find production-build/Student-Native-Full-v1.0/app/build/outputs \
            -type f \( -name '*.apk' -o -name '*.aab' \) -print

      - name: Upload MediaFire APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.0.0-Release-APK-MediaFire
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.0.0-Release-AAB-GooglePlay
          path: production-build/Student-Native-Full-v1.0/app/build/outputs/bundle/stableRelease/app-stable-release.aab
          if-no-files-found: error
          retention-days: 30
