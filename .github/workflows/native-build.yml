name: Build Student v1.9.0 Beta QA APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-English-v1.9.0-QA.zip'
      - '.github/workflows/native-build.yml'

jobs:
  beta-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract and verify Student v1.9.0 QA
        shell: bash
        run: |
          set -e
          rm -rf qa-build
          mkdir -p qa-build
          unzip -q Student-English-v1.9.0-QA.zip -d qa-build

          GRADLEW="$(find qa-build -type f -name gradlew | head -n 1 || true)"
          test -n "$GRADLEW"
          PROJECT="$(dirname "$GRADLEW")"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          test -f "$PROJECT/app/build.gradle"
          test -f "$PROJECT/feature/home/src/main/java/com/student/feature/home/ReelsScreen.kt"
          test -f "$PROJECT/app/src/main/java/com/student/app/ForcedUpdateScreen.kt"
          test -f "$PROJECT/supabase/migrations/20260830_student_v190_reels_update_control.sql"
          grep -q "versionName '1.9.0'" "$PROJECT/app/build.gradle"
          grep -q "versionCode 17" "$PROJECT/app/build.gradle"

      - name: Build ONE Beta QA APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleBetaDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT/app/build/outputs/apk/beta/debug" -type f -name '*.apk' | head -n 1 || true)"
          test -n "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Beta QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v1.9.0-Beta-QA-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
