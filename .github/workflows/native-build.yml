name: Build Student Native FIX6 APK

on:
  workflow_dispatch:

jobs:
  build-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download FIX6 from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf native-build
          mkdir -p native-build
          gh release download FIX6 \
            --repo "${{ github.repository }}" \
            --pattern "Student-Native-Full-v1.0-FIX6.zip" \
            --dir .

          ls -lh Student-Native-Full-v1.0-FIX6.zip
          unzip -q Student-Native-Full-v1.0-FIX6.zip -d native-build

      - name: Build stable debug APK
        working-directory: native-build/Student-Native-Full-v1.0
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStableDebug

      - name: Show APK output
        if: always()
        run: |
          find native-build/Student-Native-Full-v1.0/app/build/outputs/apk \
            -type f -name '*.apk' -print 2>/dev/null || true

      - name: Upload Student FIX6 APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Native-v1.0-FIX6-stable-debug
          path: native-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/debug/app-stable-debug.apk
          if-no-files-found: error
          retention-days: 14
