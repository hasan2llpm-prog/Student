name: Build Student Final Admin Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'Student-Native-v1.0.0-FINAL-ADMIN.zip'
      - '.github/workflows/final-admin-release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          rm -rf final-admin-build
          mkdir -p final-admin-build
          unzip -q Student-Native-v1.0.0-FINAL-ADMIN.zip -d final-admin-build
          test -f final-admin-build/Student-Native-Full-v1.0/gradlew
          test -f final-admin-build/Student-Native-Full-v1.0/app/build.gradle
          test -f final-admin-build/Student-Native-Full-v1.0/feature/home/src/main/java/com/student/feature/home/AdminStoreManagementPane.kt
          test -f final-admin-build/Student-Native-Full-v1.0/supabase/migrations/20260824_student_admin_store_control.sql
          echo "Final admin project verified"

      - name: Restore signing keystore
        env:
          STUDENT_KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
        run: |
          test -n "$STUDENT_KEYSTORE_B64" || (echo "Missing STUDENT_KEYSTORE_B64" && exit 1)
          echo "$STUDENT_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/student-release-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/student-release-upload.jks" \
            -storepass "${{ secrets.STUDENT_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.STUDENT_KEY_ALIAS }}" >/dev/null
          echo "Signing key verified"

      - name: Build signed APK and AAB
        working-directory: final-admin-build/Student-Native-Full-v1.0
        env:
          STUDENT_KEYSTORE_PATH: ${{ runner.temp }}/student-release-upload.jks
          STUDENT_KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          STUDENT_KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          STUDENT_KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :app:assembleStableRelease \
            :app:bundleStableRelease

      - name: Verify signed APK
        run: |
          APK="final-admin-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload MediaFire APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Final-Admin-Release-APK-MediaFire
          path: final-admin-build/Student-Native-Full-v1.0/app/build/outputs/apk/stable/release/app-stable-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-Final-Admin-Release-AAB-GooglePlay
          path: final-admin-build/Student-Native-Full-v1.0/app/build/outputs/bundle/stableRelease/app-stable-release.aab
          if-no-files-found: error
          retention-days: 30
