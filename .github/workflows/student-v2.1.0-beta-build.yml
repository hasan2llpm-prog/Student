name: Build Student v2.1.0 Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Student-v2.1.0-BETA-VOCAB5000.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          echo "Found $ZIP_FILE"

      - name: Extract Student project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q Student-v2.1.0-BETA-VOCAB5000.zip -d extracted

          echo "Project extracted successfully."

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "extracted/settings.gradle" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          else
            PROJECT_DIR="$(find extracted -type f -name settings.gradle -printf '%h\n' | head -n 1)"
          fi

          if [ -z "${PROJECT_DIR:-}" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Beta project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/build.gradle
          test -f gradlew
          test -f settings.gradle

          test -f app/src/main/java/com/student/app/MainActivity.kt
          test -f feature/home/src/main/java/com/student/feature/home/EnglishAcademyScreen.kt
          test -f feature/home/src/main/java/com/student/feature/home/Oxford5000Vocabulary.kt
          test -f feature/home/src/main/assets/oxford_5000_ar.json

          grep -q "applicationId 'com.studentiraq.app'" app/build.gradle
          grep -q "versionCode 22" app/build.gradle
          grep -q "versionName '2.1.0'" app/build.gradle
          grep -q "beta {" app/build.gradle

          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("feature/home/src/main/assets/oxford_5000_ar.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("Vocabulary JSON must be a list.")

          if len(data) != 5000:
              raise SystemExit(
                  f"Vocabulary count is {len(data)}, expected exactly 5000."
              )

          print("Vocabulary verified:", len(data))
          PY

      - name: Configure Beta debug signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          old = """release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }"""

          new = """release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }"""

          if old not in text:
              raise SystemExit(
                  "Could not locate release signing block in app/build.gradle"
              )

          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8"
          )

          print("Beta build configured to use debug signing.")
          PY

      - name: Build Beta APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            :app:assembleBetaRelease \
            --stacktrace

      - name: Collect Beta APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/beta/release" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "${APK:-}" ]; then
            echo "ERROR: Beta APK not found."
            exit 1
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/dist/Student-v2.1.0-BETA.apk"

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.1.0-BETA-APK
          path: dist/Student-v2.1.0-BETA.apk
          if-no-files-found: error
          retention-days: 14
