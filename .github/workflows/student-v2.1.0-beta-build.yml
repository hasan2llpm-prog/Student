name: Build Student v2.1.0 Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Student-v2.1.0-BETA-VOCAB5000.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: $ZIP_FILE not found"
            exit 1
          }

          echo "Found $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -q Student-v2.1.0-BETA-VOCAB5000.zip -d extracted

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find extracted \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -type f | head -n 1 || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR="$GITHUB_WORKSPACE/$(dirname "$SETTINGS_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f gradlew || {
            echo "ERROR: gradlew not found"
            exit 1
          }

          test -d app || {
            echo "ERROR: app module not found"
            exit 1
          }

          chmod +x gradlew

          echo "Project files verified"

      - name: Verify Oxford 5000
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          VOCAB_FILE="$(find . -type f -name "oxford_5000_ar.json" | head -n 1 || true)"

          if [ -z "$VOCAB_FILE" ]; then
            echo "ERROR: oxford_5000_ar.json not found"
            exit 1
          fi

          python3 - "$VOCAB_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("Vocabulary JSON must be a list")

          if len(data) != 5000:
              raise SystemExit(
                  f"Expected 5000 vocabulary items, found {len(data)}"
              )

          print("Vocabulary verified:", len(data))
          PY

      - name: Configure Beta debug signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f app/build.gradle ]; then
            sed -i \
              's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' \
              app/build.gradle
          fi

          if [ -f app/build.gradle.kts ]; then
            sed -i \
              's/signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName("debug")/g' \
              app/build.gradle.kts
          fi

          echo "Beta signing configured"

      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --version

      - name: Build Beta APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleBetaRelease

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dist/Student-v2.1.0-BETA.apk"

          ls -lh "$GITHUB_WORKSPACE/dist/Student-v2.1.0-BETA.apk"

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.1.0-BETA-APK
          path: dist/Student-v2.1.0-BETA.apk
          if-no-files-found: error
          retention-days: 14
