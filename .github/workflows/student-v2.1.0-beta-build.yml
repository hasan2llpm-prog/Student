name: Build Student v2.1.0 Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-beta:
    name: Build Beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Student-v2.1.0-BETA-VOCAB5000.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE not found in repository root."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

      - name: Extract Student project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q "Student-v2.1.0-BETA-VOCAB5000.zip" -d extracted

          echo "ZIP extracted successfully."

      - name: Detect project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          if [ -f "extracted/settings.gradle" ] || [ -f "extracted/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          else
            SETTINGS_FILE="$(find extracted \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f | head -n 1 || true)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find Android project root."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected project root:"
          echo "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK 36 installed successfully."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

          if [ ! -f "app/build.gradle" ] && [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app Gradle file not found."
            exit 1
          fi

          echo "Basic Android project structure verified."

      - name: Verify Oxford 5000 database
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          VOCAB_FILE="$(find . -type f -name "oxford_5000_ar.json" | head -n 1 || true)"

          if [ -z "$VOCAB_FILE" ]; then
            echo "ERROR: oxford_5000_ar.json not found."
            exit 1
          fi

          echo "Vocabulary file:"
          echo "$VOCAB_FILE"

          python3 - "$VOCAB_FILE" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("ERROR: Vocabulary JSON root must be a list.")

          count = len(data)

          print(f"Vocabulary count: {count}")

          if count != 5000:
              raise SystemExit(
                  f"ERROR: Expected exactly 5000 vocabulary records, found {count}."
              )

          print("Oxford 5000 verification passed.")
          PY

      - name: Show Gradle version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew --version

      - name: Configure Beta signing
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f "app/build.gradle" ]; then
            python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("app/build.gradle")
          text = path.read_text(encoding="utf-8")

          # Beta APK only:
          # replace release signing with Android debug signing if present.
          text = re.sub(
              r"signingConfig\s+signingConfigs\.release",
              "signingConfig signingConfigs.debug",
              text
          )

          path.write_text(text, encoding="utf-8")
          print("Groovy Gradle signing configuration prepared for Beta.")
          PY

          elif [ -f "app/build.gradle.kts" ]; then
            python3 <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "signingConfig = signingConfigs.getByName(\"release\")",
              "signingConfig = signingConfigs.getByName(\"debug\")"
          )

          path.write_text(text, encoding="utf-8")
          print("Kotlin Gradle signing configuration prepared for Beta.")
          PY

          else
            echo "ERROR: No app Gradle file found."
            exit 1
          fi

      - name: List available Beta tasks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew :app:tasks --all \
            | grep -i "assemble.*beta" \
            || true

      - name: Build Student Beta APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleBetaRelease

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/dist"

          echo "Searching for generated APK..."

          find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print || true

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -iname "*beta*release*.apk" \
            | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)"
          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/dist/Student-v2.1.0-BETA.apk"

          echo "APK prepared:"
          ls -lh "$GITHUB_WORKSPACE/dist/Student-v2.1.0-BETA.apk"

      - name: Upload Student Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.1.0-BETA-APK
          path: dist/Student-v2.1.0-BETA.apk
          if-no-files-found: error
          retention-days: 14
