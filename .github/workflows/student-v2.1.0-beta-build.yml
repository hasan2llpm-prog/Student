name: Build Student v2.6.0 Production APK + AAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify production ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Student-v2.6.0-STABLE-PRODUCTION.zip"
          test -f "$ZIP" || { echo "ERROR: $ZIP not found in repository root"; exit 1; }
          unzip -tq "$ZIP"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir extracted
          unzip -q Student-v2.6.0-STABLE-PRODUCTION.zip -d extracted
          SETTINGS="$(find extracted \( -name settings.gradle -o -name settings.gradle.kts \) -type f | head -n 1 || true)"
          test -n "$SETTINGS" || { echo "ERROR: settings.gradle not found"; exit 1; }
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore production signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.STUDENT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STUDENT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STUDENT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STUDENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!v:-}" || { echo "ERROR: missing GitHub secret $v"; exit 1; }
          done
          KEYSTORE_PATH="$RUNNER_TEMP/student-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "STUDENT_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "STUDENT_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STUDENT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STUDENT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Static release checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          grep -q "versionCode 29" app/build.gradle
          grep -q "versionName '2.6.0'" app/build.gradle
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY\s*=|BEGIN (RSA |EC |)PRIVATE KEY' app core feature || {
            echo "ERROR: private server secret found in Android sources"; exit 1;
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          vocab = next(Path('.').rglob('oxford_5000_ar.json'))
          grammar = next(Path('.').rglob('grammar_300_bilingual.json'))
          assert len(json.loads(vocab.read_text(encoding='utf-8'))) == 5000
          assert len(json.loads(grammar.read_text(encoding='utf-8'))) == 300
          print('Content checks passed: vocabulary=5000, grammar=300')
          PY

      - name: Verify Rooms v2.6 and Story publish flow
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f supabase/migrations/20260908_student_v250_rooms_ux.sql
          grep -q 'student_voice_room_feed_v26' core/data/src/main/java/com/student/core/data/SupabaseApi.kt
          grep -q 'student_voice_room_send_gift_v26' core/data/src/main/java/com/student/core/data/SupabaseApi.kt
          test -f supabase/migrations/20260908_student_v260_rooms_final.sql
          grep -q '10 مايكات' feature/home/src/main/java/com/student/feature/home/AdminScreen.kt
          grep -q 'openPublishedStory' feature/home/src/main/java/com/student/feature/home/StoriesScreen.kt
          grep -q 'خلفيات الغرف' feature/home/src/main/java/com/student/feature/home/StoreScreen.kt

      - name: Build signed Stable APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace :app:assembleStableRelease :app:bundleStableRelease

      - name: Verify and collect release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/stable/release" -type f -name '*.apk' | head -n 1 || true)"
          AAB="$(find "$PROJECT_DIR/app/build/outputs/bundle/stableRelease" -type f -name '*.aab' | head -n 1 || true)"
          test -n "$APK" || { echo "ERROR: signed APK not found"; exit 1; }
          test -n "$AAB" || { echo "ERROR: signed AAB not found"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/Student-v2.6.0.apk"
          cp "$AAB" "$GITHUB_WORKSPACE/dist/Student-v2.6.0.aab"
          sha256sum "$GITHUB_WORKSPACE/dist/Student-v2.6.0.apk" "$GITHUB_WORKSPACE/dist/Student-v2.6.0.aab" > "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.6.0-APK
          path: dist/Student-v2.6.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.6.0-AAB
          path: dist/Student-v2.6.0.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Student-v2.6.0-SHA256
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish Student v2.6.0 Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="v2.6.0"
          APK="dist/Student-v2.6.0.apk"
          AAB="dist/Student-v2.6.0.aab"
          SUMS="dist/SHA256SUMS.txt"

          test -s "$APK"
          test -s "$AAB"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" "$SUMS" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" "$SUMS" \
              --title "Student v2.6.0" \
              --notes "Student v2.6.0 Production"
          fi

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Student-v2.6.0.apk"

          # Do not activate a forced update until the APK is really downloadable.
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --range 0-0 "$APK_URL" -o /dev/null; then
              echo "APK is reachable."
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "ERROR: release APK is not reachable; update was NOT activated."
              exit 1
            fi
            sleep 5
          done

          echo "apk_url=$APK_URL" >> "$GITHUB_OUTPUT"

      - name: Activate internal update and notify all users
        shell: bash
        env:
          # This is the only additional secret required for automatic publishing.
          # Store it in GitHub > Settings > Secrets and variables > Actions.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APK_URL: ${{ steps.release.outputs.apk_url }}
        run: |
          set -euo pipefail

          SUPABASE_URL="https://mlcbixsyizsuxxfjwrym.supabase.co"
          API="${SUPABASE_URL}/rest/v1"

          test -n "${SUPABASE_SERVICE_ROLE_KEY:-}" || {
            echo "ERROR: missing GitHub Repository Secret SUPABASE_SERVICE_ROLE_KEY"
            exit 1
          }

          AUTH=(
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}"
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
            -H "Content-Type: application/json"
          )

          # Preserve the most recent update notification id when possible.
          # send-push uses the notification id as the Android FCM tag, so reusing
          # it lets the new v2.6 notification replace the old update alert.
          OLD_JSON="$(curl --fail-with-body --silent --show-error \
            "${API}/notifications?kind=eq.app_update&select=id&order=created_at.desc&limit=1" \
            "${AUTH[@]}")"
          OLD_ID="$(printf '%s' "$OLD_JSON" | jq -r '.[0].id // empty')"

          # Remove old update rows from Student's notification center.
          curl --fail-with-body --silent --show-error \
            -X DELETE "${API}/notifications?kind=eq.app_update" \
            "${AUTH[@]}" \
            -H "Prefer: return=minimal"

          # Activate v2.6.0 as the only supported release.
          SETTINGS="$(jq -nc --arg url "$APK_URL" '{
            id:1,
            force_update:true,
            minimum_version_code:29,
            latest_version_code:29,
            apk_url:$url,
            update_message:"يتوفر الآن Student 2.6.0. يجب تحديث التطبيق للاستمرار.",
            updated_at:(now | todateiso8601)
          }')"

          curl --fail-with-body --silent --show-error \
            -X POST "${API}/student_runtime_settings?on_conflict=id" \
            "${AUTH[@]}" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$SETTINGS"

          # Queue exactly one global app_update notification.
          if [ -n "$OLD_ID" ]; then
            NOTICE="$(jq -nc \
              --arg id "$OLD_ID" \
              --arg url "$APK_URL" \
              '{
                id:$id,
                user_id:null,
                actor_id:null,
                title:"تحديث جديد لـ Student",
                body:"الإصدار 2.6.0 جاهز الآن. اضغط للتحديث والاستمرار.",
                kind:"app_update",
                link:"notifications",
                audience:"all",
                is_broadcast:true,
                is_read:false,
                metadata:{
                  target_type:"app_update",
                  version_name:"2.6.0",
                  version_code:29,
                  minimum_version_code:29,
                  force_update:true,
                  apk_url:$url,
                  notification_key:"app_update_v29"
                }
              }')"
          else
            NOTICE="$(jq -nc \
              --arg url "$APK_URL" \
              '{
                user_id:null,
                actor_id:null,
                title:"تحديث جديد لـ Student",
                body:"الإصدار 2.6.0 جاهز الآن. اضغط للتحديث والاستمرار.",
                kind:"app_update",
                link:"notifications",
                audience:"all",
                is_broadcast:true,
                is_read:false,
                metadata:{
                  target_type:"app_update",
                  version_name:"2.6.0",
                  version_code:29,
                  minimum_version_code:29,
                  force_update:true,
                  apk_url:$url,
                  notification_key:"app_update_v29"
                }
              }')"
          fi

          curl --fail-with-body --silent --show-error \
            -X POST "${API}/notifications" \
            "${AUTH[@]}" \
            -H "Prefer: return=minimal" \
            --data "$NOTICE"

          echo "v2.6.0 update activated and broadcast queued."

      - name: Verify v2.6.0 runtime update
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          SUPABASE_URL="https://mlcbixsyizsuxxfjwrym.supabase.co"

          RESULT="$(curl --fail-with-body --silent --show-error \
            "${SUPABASE_URL}/rest/v1/student_runtime_settings?id=eq.1&select=force_update,minimum_version_code,latest_version_code,apk_url" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")"

          printf '%s' "$RESULT" | jq -e '
            length == 1 and
            .[0].force_update == true and
            .[0].minimum_version_code == 29 and
            .[0].latest_version_code == 29 and
            (.[0].apk_url | endswith("/releases/download/v2.6.0/Student-v2.6.0.apk"))
          ' >/dev/null

          echo "Student v2.6.0 forced-update configuration verified."

