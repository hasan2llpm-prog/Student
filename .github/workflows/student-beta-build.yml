name: Build Student Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-beta-build
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Compile Beta Kotlin
        run: gradle --no-daemon --stacktrace :app:compileBetaDebugKotlin

      - name: Build Beta APK
        run: gradle --no-daemon --stacktrace :app:assembleBetaDebug

      - name: Verify Beta package
        run: |
          APK="app/build/outputs/apk/beta/debug/app-beta-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump packagename "$APK" || true
          sha256sum "$APK"

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Beta-debug
          path: app/build/outputs/apk/beta/debug/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 30
